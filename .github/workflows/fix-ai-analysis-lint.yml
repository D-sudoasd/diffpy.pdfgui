name: Apply AI analysis lint fix

on:
  push:
    branches:
      - "agent/fix-ai-analysis-lint"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "agent/fix-ai-analysis-lint"
      - name: Apply reviewed source changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/diffpy/pdfgui/analysis/report.py")
          text = path.read_text(encoding="utf-8")
          unused_import = "from pathlib import Path\n"
          long_line = (
              "or question provides an explicit structural basis. Treat detected positive and negative "
              "features as signal features,"
          )
          wrapped_line = (
              "or question provides an explicit structural basis. Treat detected positive and negative "
              "features as signal \\\nfeatures,"
          )
          if text.count(unused_import) != 1:
              raise SystemExit("unexpected pathlib import count")
          if text.count(long_line) != 1:
              raise SystemExit("expected prompt line was not found exactly once")
          text = text.replace(unused_import, "", 1).replace(long_line, wrapped_line, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate syntax and configured line length
        run: |
          python -m compileall -q src tests
          python - <<'PY'
          import ast
          from pathlib import Path

          target = Path("src/diffpy/pdfgui/analysis/report.py")
          text = target.read_text(encoding="utf-8")
          ast.parse(text, filename=str(target))
          overlong = [(number, len(line)) for number, line in enumerate(text.splitlines(), 1) if len(line) > 115]
          if overlong:
              raise SystemExit(f"overlong lines: {overlong}")
          PY
      - name: Commit reviewed fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-ai-analysis-lint.yml
          git add src/diffpy/pdfgui/analysis/report.py
          git commit -m "Fix AI analysis lint issues"
          git push
