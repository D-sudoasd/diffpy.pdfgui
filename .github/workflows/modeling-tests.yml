name: Modeling integration tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  modeling-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install numpy scipy pytest

      - name: Run modeling tests
        id: tests
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python -m pytest -q tests/test_modeling.py > modeling-test.log 2>&1
          status=$?
          cat modeling-test.log
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload modeling test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modeling-test-log
          path: modeling-test.log
          if-no-files-found: error

      - name: Compile modeling modules
        if: steps.tests.outputs.status == '0'
        run: |
          python -m compileall -q src/diffpy/pdfgui/modeling src/diffpy/pdfgui/gui/modeling.py

  install-modeling-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install DiffPy modeling packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/modeling.txt

      - name: Import modeling packages
        id: imports
        shell: bash
        run: |
          set +e
          python - <<'PY' > modeling-import.log 2>&1
          from importlib import import_module

          checks = (
              ("diffpy.structure", "Structure"),
              ("diffpy.srreal.pdfcalculator", "PDFCalculator"),
              ("diffpy.srfit.fitbase", "FitRecipe"),
              ("diffpy.morph.morphpy", "morph"),
          )
          for module_name, attribute_name in checks:
              print(f"Importing {module_name}.{attribute_name}", flush=True)
              module = import_module(module_name)
              value = getattr(module, attribute_name)
              if value is None:
                  raise RuntimeError(f"{module_name}.{attribute_name} resolved to None")
              print("OK", flush=True)
          PY
          status=$?
          cat modeling-import.log
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload modeling import log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modeling-import-log
          path: modeling-import.log
          if-no-files-found: error

      - name: Record backend status
        if: steps.imports.outputs.status == '0'
        run: |
          PYTHONPATH=src python -m diffpy.pdfgui.modeling.cli doctor --json \
            --output modeling-backends.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("modeling-backends.json").read_text(encoding="utf-8"))
          states = {item["backend_id"]: item["state"] for item in payload}
          required = ("structure", "srreal", "srfit", "diffpy-cmi", "diffpy-morph")
          missing = [backend for backend in required if states.get(backend) != "available"]
          if missing:
              raise SystemExit(f"unavailable installed backend(s): {', '.join(missing)}")
          PY

      - name: Upload backend status
        if: steps.imports.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: modeling-backend-status
          path: modeling-backends.json
          if-no-files-found: error
